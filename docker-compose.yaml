# Projet séparé du dev : conteneurs et volume pgdata distincts
name: fleetenergies-prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Pas de port publié : la base n'est joignable que depuis le réseau Docker
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs:
    build:
      context: .
      dockerfile: apps/nestjs/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "${NESTJS_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_PORT: 3100
    ports:
      - "${MCP_PORT:-3100}:3100"
    depends_on:
      - nestjs

  investigator:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
      target: prod
    restart: unless-stopped
    command: ["node", "dist/investigator.js"]
    env_file: .env
    # Ollama tourne sur l'hôte (GPU Metal) ; nécessaire sous Linux, implicite sur Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nestjs
      - mcp-server
    deploy:
      replicas: 1

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:8080"
    depends_on:
      - nestjs

volumes:
  pgdata:
