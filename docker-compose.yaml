# Project separate from dev: distinct containers and volumes (pgdata, simdata)
name: fleetenergies-prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: the database is only reachable from the Docker network
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs:
    build:
      context: .
      dockerfile: apps/nestjs/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      INVOICE_STORAGE_DIR: /data/invoices
    ports:
      - "${NESTJS_PORT}:3000"
    # V2: received PDF invoices (emptied by /admin/wipe)
    volumes:
      - invoices:/data/invoices
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_PORT: 3100
    ports:
      - "${MCP_PORT:-3100}:3100"
    depends_on:
      - nestjs

  investigator:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
      target: prod
    restart: unless-stopped
    command: ["node", "dist/investigator.js"]
    env_file: .env
    # Ollama runs on the host (Metal GPU); required on Linux, implicit on Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nestjs
      - mcp-server
    deploy:
      replicas: 1

  # V2: invoice extractor (same image as the investigator, other entry point)
  extractor:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
      target: prod
    restart: unless-stopped
    command: ["node", "dist/extractor.js"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - nestjs

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      SIM_PORT: 3200
      SIM_DATA_DIR: /data
    # No published port: driven from the control room (nginx relays /simulation)
    volumes:
      - simdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - nestjs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:8080"
    depends_on:
      - nestjs
      - simulator

volumes:
  pgdata:
  simdata:
  invoices:
