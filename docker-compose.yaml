# Projet séparé du dev : conteneurs et volume pgdata distincts
name: fleetenergies-prod

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Pas de port publié : la base n'est joignable que depuis le réseau Docker
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs:
    build:
      context: .
      dockerfile: apps/nestjs/Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "${NESTJS_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
