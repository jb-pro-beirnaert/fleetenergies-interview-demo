services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs:
    build:
      context: ./feid-nestjs
      target: dev
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "${API_PORT}:3000"
    volumes:
      # Code source monté : `nest start --watch` recompile à chaque modification
      - ./feid-nestjs:/app
      # node_modules de l'image (binaires Linux), pas ceux de l'hôte macOS
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
