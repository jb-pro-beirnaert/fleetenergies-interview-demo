services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nestjs:
    build:
      context: .
      dockerfile: apps/nestjs/Dockerfile
      target: dev
    env_file: .env
    environment:
      PORT: 3000
      INVOICE_STORAGE_DIR: /data/invoices
    ports:
      - "${NESTJS_PORT}:3000"
    volumes:
      # Only src/ is mounted: `nest start --watch` recompiles on every change.
      # node_modules (Linux binaries) stay those of the image, no volume to create.
      # Dependency or config change (package.json, tsconfig…): restart with --build
      - ./apps/nestjs/src:/app/apps/nestjs/src
      - ./apps/nestjs/prisma:/app/apps/nestjs/prisma
      - ./packages/contracts/src:/app/packages/contracts/src
      # V2: received PDF invoices (emptied by /admin/wipe)
      - invoices:/data/invoices
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: dev
    env_file: .env
    environment:
      MCP_PORT: 3100
    ports:
      - "${MCP_PORT:-3100}:3100"
    volumes:
      # Only src/ is mounted: `tsx watch` restarts on every change
      - ./apps/mcp-server/src:/app/apps/mcp-server/src
      - ./packages/contracts/src:/app/packages/contracts/src
    depends_on:
      - nestjs

  investigator:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
      target: dev
    command: ["npm", "run", "dev:investigator"]
    env_file: .env
    # Ollama runs on the host (Metal GPU); required on Linux, implicit on Docker Desktop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/agents/src:/app/apps/agents/src
      - ./packages/contracts/src:/app/packages/contracts/src
    depends_on:
      - nestjs
      - mcp-server
    deploy:
      replicas: 1

  # V2: invoice extractor (same image as the investigator, other entry point)
  extractor:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
      target: dev
    command: ["npm", "run", "dev:extractor"]
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apps/agents/src:/app/apps/agents/src
      - ./packages/contracts/src:/app/packages/contracts/src
    depends_on:
      - nestjs

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
      target: dev
    env_file: .env
    environment:
      SIM_PORT: 3200
      SIM_DATA_DIR: /data
    ports:
      - "${SIM_PORT:-3200}:3200"
    volumes:
      # `node --watch` restarts on every change; the simulation state is resumed from simdata
      - ./apps/simulator/src:/app/apps/simulator/src
      - ./packages/contracts/src:/app/packages/contracts/src
      - simdata:/data
    depends_on:
      - nestjs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      # Targets of the `ng serve` proxies (see apps/web/proxy.conf.mjs)
      API_PROXY_TARGET: http://nestjs:3000
      SIMULATION_PROXY_TARGET: http://simulator:3200
    ports:
      - "${WEB_PORT:-4200}:4200"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./packages/contracts/src:/app/packages/contracts/src
    depends_on:
      - nestjs
      - simulator

volumes:
  pgdata:
  simdata:
  invoices:
