server {
  listen 8080;
  root /usr/share/nginx/html;

  # Appels API relayés vers NestJS (même origine, pas de CORS)
  location /api/ {
    proxy_pass http://nestjs:3000;
    proxy_set_header Host $host;
  }

  # Routage côté client Angular
  location / {
    try_files $uri $uri/ /index.html;
  }
}
