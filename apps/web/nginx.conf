server {
  listen 8080;
  root /usr/share/nginx/html;

  # API calls relayed to NestJS (same origin, no CORS)
  location /api/ {
    proxy_pass http://nestjs:3000;
    proxy_set_header Host $host;
  }

  # Simulation control relayed to the simulator
  location /simulation {
    proxy_pass http://simulator:3200;
    proxy_set_header Host $host;
  }

  # Angular client-side routing
  location / {
    try_files $uri $uri/ /index.html;
  }
}
