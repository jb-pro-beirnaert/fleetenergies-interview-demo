# Test database for the API integration tests (`npm run test:e2e -w apps/nestjs`).
# Separate project, in-memory data (tmpfs): nothing persists, nothing is shared with dev.
# The API only talks to Postgres: no other service to simulate for its tests.
name: fleetenergies-test

services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet_test
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    # Throwaway database: no durability needed, faster tests
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_test"]
      interval: 2s
      timeout: 3s
      retries: 20
